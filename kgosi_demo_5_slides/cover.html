<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KGOSI/JARVIS Demo</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .slide-container { width: 1280px; min-height: 720px; background: #02060c; color: #ffffff; position: relative; top: -9px; overflow: hidden; font-family: Arial, Helvetica, sans-serif; }
    .hero-image { position: absolute; inset: 0; width: 1280px; height: 720px; object-fit: cover; opacity: .35; }
    .veil { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(1,5,10,.98) 0%, rgba(1,5,10,.88) 45%, rgba(1,5,10,.4) 100%); }
    .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(85,185,238,.1) 1px, transparent 1px), linear-gradient(90deg, rgba(85,185,238,.1) 1px, transparent 1px); background-size: 64px 64px; opacity: .4; }
    .content { position: absolute; left: 86px; top: 135px; width: 750px; }
    .eyebrow { color: #55b9ee; font-size: 19px; letter-spacing: 5px; font-weight: 900; text-transform: uppercase; margin-bottom: 24px; text-shadow: 0 0 10px rgba(85,185,238,.3); }
    h1 { margin: 0; font-size: 88px; line-height: .95; letter-spacing: -3px; font-weight: 900; }
    h1 span { color: #55b9ee; }
    .rule { width: 220px; height: 8px; background: #55b9ee; margin: 35px 0 30px; box-shadow: 0 0 15px rgba(85,185,238,.5); }
    .subtitle { margin: 0; font-size: 32px; line-height: 1.2; color: #ffffff; max-width: 680px; font-weight: 800; }
    .scope { margin-top: 45px; padding-top: 20px; border-top: 2px solid rgba(85,185,238,.6); color: #55b9ee; font-size: 18px; letter-spacing: 2px; font-weight: 900; }
    .corner { position: absolute; right: 54px; bottom: 42px; color: #55b9ee; font-size: 16px; letter-spacing: 3px; font-weight: 900; }
  </style>
</head>
<body>
  <div class="slide-container">
    <img class="hero-image" src="/home/ubuntu/upload/search_images/LO5qmLFEj7s3.jpg" alt="Futuristic command centre reference" />
    <div class="veil"></div>
    <div class="grid"></div>
    <div class="content">
      <div class="eyebrow">Demo 01 · Enterprise Intelligence</div>
      <h1>KGOSI<span>/</span>JARVIS</h1>
      <div class="rule"></div>
      <p class="subtitle">A practical decision-support demonstration for the organisation’s leadership.</p>
      <p class="scope">BITC PUBLIC INFORMATION + SYNTHETIC ENTERPRISE DATA</p>
    </div>
    <div class="corner">CLIENT PRESENTATION · 2026</div>
  </div>
</body>
</html>
