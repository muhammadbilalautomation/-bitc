<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px; /* keep as required */
            background: #E0F2FE;
            color: #09090B;
            font-family: sans-serif;
            position: relative;
            display: flex;
            flex-direction: column;
            padding-top: 60px; /* do not shrink */
        }
        .left-rule {
            position: absolute;
            left: 40px;
            top: 60px;
            bottom: 60px;
            width: 8px;
            background: #0284C7;
        }
        .content {
            margin-left: 80px;
            padding-right: 80px;
        }
        .upper-third {
            min-height: 240px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }
        h1 {
            font-size: 160px;
            font-weight: 900;
            line-height: 1;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .subtitle {
            font-size: 32px;
            font-weight: 500;
            color: #0284C7;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .body-text {
            font-size: 24px;
            font-weight: 500;
            line-height: 1.4;
            max-width: 800px;
            margin-top: 20px; /* reduced from 40 to save vertical space */
        }
        .image-container {
            margin-top: 10px; /* reduced from 40 */
            width: 700px;
            height: 200px; /* reduced from 300 to fit under 720px */
            border: 4px solid #09090B;
            overflow: hidden;
        }
        .image-container img {
            width: 100%;
            height: auto;
            max-height: 100%; /* ensure large images don't overflow their container */
            object-fit: cover;
            display: block;
        }
        .footer {
            position: absolute;
            bottom: 60px;
            left: 80px;
            font-size: 18px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="left-rule"></div>
        <div class="content">
            <div class="upper-third">
                <h1>KGOSI</h1>
                <div class="subtitle">Enterprise Autonomous Intelligence Operating System</div>
            </div>
            <div class="body-text">
                A separate intelligence layer that sits above existing business systems to help leadership understand what is happening, why it is happening, and what should be considered.
            </div>
            <div class="image-container">
                <img src="/home/ubuntu/upload/search_images/LO5qmLFEj7s3.jpg" alt="Futuristic Command Center">
            </div>
        </div>
        <div class="footer">
            DEMO 1: PROVING THE OPERATING MODEL
        </div>
    </div>
</body>
</html>
